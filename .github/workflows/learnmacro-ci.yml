# CI — LearnMacro

name: CI

on:
  push:
    paths:
      - "LearnMacro/**"
      - ".github/workflows/learnmacro-ci.yml"
  pull_request:
    paths:
      - "LearnMacro/**"
      - ".github/workflows/learnmacro-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: LearnMacro

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Run tests
        run: clojure -M:test
      - name: Run demos
        run: clojure -M:run
      - name: Run verify suite
        run: clojure -M:verify
